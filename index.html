<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>財務報表</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { background:#111; color:#eee; font-family:'Noto Sans TC', sans-serif; padding:20px; }
    h1 { text-align:center; margin-bottom:1em; }
    label { display:block; margin:10px 0; }
    input { width:100%; padding:8px; font-size:1rem; background:#222; color:#fff; border:1px solid #444; border-radius:6px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:15px; margin-bottom:2em; }
    #netProfit { font-weight:bold; font-size:1.2em; color:#0f0; }
    canvas { background:#222; border-radius:10px; padding:10px; }
  </style>
</head>
<body>
  <h1>財務報表</h1>
  <div class="grid">
    <label>資本<input id="capital" type="number"></label>
    <label>收入<input id="income" type="number" oninput="debouncedCalc()"></label>
    <label>銷售支出<input id="sellCost" type="number" oninput="debouncedCalc()"></label>
    <label>公關贈送<input id="prCost" type="number" oninput="debouncedCalc()"></label>
    <label>KOL 分潤<input id="kolCost" type="number" oninput="debouncedCalc()"></label>
    <label>營運支出<input id="opsCost" type="number" oninput="debouncedCalc()"></label>
    <label>淨利：<span id="netProfit">0</span></label>
  </div>
  <canvas id="pie" width="360" height="300"></canvas>
  <br><br>
  <canvas id="line" width="360" height="300"></canvas>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Main Script -->
  <script type="module" src="script.js"></script>
</body>
</html>
