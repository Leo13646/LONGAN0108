<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>財務報表系統</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="script.js"></script>
</head>
<body>
  <header>
    <h1>財務報表系統</h1>
    <p class="motto">創業，就是在別人懷疑你時，你還敢繼續相信自己。</p>
  </header>

  <section class="form-section">
    <h2>新增一筆紀錄</h2>
    <form id="entryForm">
      <input type="text" id="desc" placeholder="描述 (收入/支出)" required />
      <input type="number" id="amount" placeholder="金額" required />
      <select id="type">
        <option value="income">收入</option>
        <option value="sellCost">銷售支出</option>
        <option value="prCost">公關贈送</option>
        <option value="kolCost">KOL 分潤</option>
        <option value="opsCost">營運支出</option>
      </select>
      <button type="submit">＋ 新增</button>
    </form>
  </section>

  <section class="summary">
    <div>資本：<span id="capital">0</span></div>
    <div>收入：<span id="income">0</span></div>
    <div>銷售支出：<span id="sellCost">0</span></div>
    <div>公關贈送：<span id="prCost">0</span></div>
    <div>KOL 分潤：<span id="kolCost">0</span></div>
    <div>營運支出：<span id="opsCost">0</span></div>
    <div>淨利：<span id="netProfit">0</span></div>
  </section>

  <section class="charts">
    <canvas id="pie" width="360" height="300"></canvas>
    <canvas id="line" width="360" height="300"></canvas>
  </section>
</body>
</html>
