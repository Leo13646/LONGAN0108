<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>財務報表</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="script.js" defer></script>
</head>
<body>
  <header class="hero">
    <h1>LONGAN 財務系統</h1>
    <p class="motto">創業，就是在別人懷疑你時，你還敢繼續相信自己。</p>
  </header>

  <section class="form">
    <select id="type">
      <option value="income">收入</option>
      <option value="expense">支出</option>
    </select>
    <input id="amount" type="number" placeholder="金額" />
    <input id="note" type="text" placeholder="備註" />
    <button id="addBtn">新增紀錄</button>
  </section>

  <section class="summary">
    <p>目前淨利：<span id="netProfit">0</span></p>
  </section>

  <section class="history">
    <table>
      <thead>
        <tr><th>類別</th><th>金額</th><th>備註</th></tr>
      </thead>
      <tbody id="history"></tbody>
    </table>
  </section>
</body>
</html>
