<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Sale 單頁版</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="script.js" defer></script>
  <style>
    body { background: #111; color: #eee; font-family: 'Noto Sans TC', sans-serif; padding-bottom: 100px; }
    .tab-section { display: none; margin-top: 2rem; }
    .active-tab { display: block; }
    nav button { margin: 0.25rem; }
    canvas { background: #222; border-radius: 10px; padding: 10px; }
    table input, table select { width: 100%; }
    .container { max-width: 960px; }
  </style>
</head>
<body>
<div class="container">
  <header class="my-4 text-center">
    <h1>E-Sale 資料系統</h1>
    <p>創業，就是在別人懷疑你時，你還敢繼續相信自己。</p>
  </header>

  <nav class="text-center mb-3">
    <button class="btn btn-outline-light" onclick="showTab('finance')">財務</button>
    <button class="btn btn-outline-light" onclick="showTab('kol')">KOL</button>
    <button class="btn btn-outline-light" onclick="showTab('stock')">庫存</button>
    <button class="btn btn-outline-light" onclick="showTab('order')">訂單</button>
  </nav>

  <!-- 財務區塊 -->
  <section id="finance" class="tab-section active-tab">
    <div class="row g-2">
      <div class="col"><label>資本<input id="capital" class="form-control" type="number"></label></div>
      <div class="col"><label>收入<input id="income" class="form-control" type="number" oninput="debouncedCalc()"></label></div>
      <div class="col"><label>銷售支出<input id="sellCost" class="form-control" type="number" oninput="debouncedCalc()"></label></div>
      <div class="col"><label>公關贈送<input id="prCost" class="form-control" type="number" oninput="debouncedCalc()"></label></div>
      <div class="col"><label>KOL 分潤<input id="kolCost" class="form-control" type="number" oninput="debouncedCalc()"></label></div>
      <div class="col"><label>營運支出<input id="opsCost" class="form-control" type="number" oninput="debouncedCalc()"></label></div>
      <div class="col"><label>淨利 <span id="netProfit">0</span></label></div>
    </div>
    <div class="row mt-4">
      <div class="col-md-6"><canvas id="pie" height="300"></canvas></div>
      <div class="col-md-6"><canvas id="line" height="300"></canvas></div>
    </div>
  </section>

  <!-- KOL 區塊 -->
  <section id="kol" class="tab-section">
    <button class="btn btn-secondary mb-2" onclick="addKolRow()">＋ 新增</button>
    <table class="table table-dark table-bordered" id="kolTable">
      <tr><th>KOL</th><th>備註</th><th>單價</th><th>數量</th><th>%</th><th>金額</th><th>狀態</th><th></th></tr>
    </table>
  </section>

  <!-- 庫存區塊 -->
  <section id="stock" class="tab-section">
    <button class="btn btn-secondary mb-2" onclick="addStockRow()">＋ 新增</button>
    <table class="table table-dark table-bordered" id="stockTable">
      <tr><th>品名</th><th>分類</th><th>成本</th><th>數量</th><th>總成本</th><th>位置</th><th>備註</th><th></th></tr>
    </table>
  </section>

  <!-- 訂單區塊 -->
  <section id="order" class="tab-section">
    <button class="btn btn-secondary mb-2" onclick="addOrderRow()">＋ 新增</button>
    <table class="table table-dark table-bordered" id="orderTable">
      <tr><th>訂單編號</th><th>品名</th><th>數量</th><th>金額</th><th>狀態</th><th>日期</th><th></th></tr>
    </table>
  </section>
</div>

<script>
function showTab(tabId) {
  document.querySelectorAll('.tab-section').forEach(sec => sec.classList.remove('active-tab'));
  document.getElementById(tabId).classList.add('active-tab');
}
</script>
</body>
</html>
