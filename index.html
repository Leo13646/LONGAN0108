<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>財務報表系統</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>財務報表系統</h1>
    <p class="quote">創業，就是在別人懷疑你時，你還敢繼續相信自己。</p>

    <section class="input-section">
      <label>資本 <input type="number" id="capital"></label>
      <label>收入 <input type="number" id="income"></label>
      <label>銷售支出 <input type="number" id="sellCost"></label>
      <label>公關贈送 <input type="number" id="prCost"></label>
      <label>KOL 分潤 <input type="number" id="kolCost"></label>
      <label>營運支出 <input type="number" id="opsCost"></label>
    </section>

    <div class="profit-display">
      淨利：<span id="netProfit">0</span>
    </div>

    <div class="button-row">
      <button onclick="addRecord()">新增一筆</button>
    </div>

    <canvas id="line" width="330" height="280"></canvas>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
