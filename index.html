<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>E-Sale v12</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module" src="script.js"></script>
</head>
<body>

  <!-- Logo + 名言 -->
  <header class="hero">
    <svg viewBox="0 0 120 120" class="logo" aria-label="Site Logo">
      <!-- 外圈 -->
      <circle cx="60" cy="60" r="55" fill="none" stroke="currentColor" stroke-width="8"/>
      <!-- 斜 X -->
      <line x1="30" y1="30" x2="90" y2="90" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
      <!-- G 三段弧 -->
      <path d="M60 27a33 33 0 1 1 0 66" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
      <path d="M60 51a9 9 0 1 1 0 18" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
    </svg>
    <p class="motto">創業，就是在別人懷疑你時，你還敢繼續相信自己。</p>
  </header>

  <!-- 導覽 -->
  <nav>
    <button onclick="show('finance')">財務</button>
    <button onclick="show('kol')">KOL</button>
    <button onclick="show('stock')">庫存</button>
    <button onclick="show('order')">訂單</button>
  </nav>

  <!-- ========= 財務 ========= -->
  <section id="finance" class="tab">
    <div class="grid">
      <label>資本<input id="capital" type="number" /></label>
      <label>收入<input id="income" type="number" oninput="debouncedCalc()"/></label>
      <label>銷售支出<input id="sellCost" type="number" oninput="debouncedCalc()"/></label>
      <label>公關贈送<input id="prCost" type="number" oninput="debouncedCalc()"/></label>
      <label>KOL 分潤<input id="kolCost" type="number" oninput="debouncedCalc()"/></label>
      <label>營運支出<input id="opsCost" type="number" oninput="debouncedCalc()"/></label>
      <label>淨利 <span id="netProfit">0</span></label>
    </div>

    <div class="charts">
      <canvas id="pie"  width="330" height="300"></canvas>
      <canvas id="line" width="330" height="300"></canvas>
    </div>
  </section>

  <!-- ========= KOL ========= -->
  <section id="kol" class="tab">
    <button onclick="addKolRow()">＋ 新增</button>
    <table id="kolTable">
      <tr>
        <th>KOL</th><th>備註</th>
        <th>單價</th><th>數量</th><th>%</th><th>金額</th>
        <th>狀態</th><th></th>
      </tr>
    </table>
  </section>

  <!-- ========= 庫存 ========= -->
  <section id="stock" class="tab">
    <button onclick="addStockRow()">＋ 新增</button>
    <table id="stockTable">
      <tr>
        <th>品名</th><th>分類</th><th>成本</th><th>數量</th>
        <th>總成本</th><th>位置</th><th>備註</th><th></th>
      </tr>
    </table>
  </section>

  <!-- ========= 訂單 ========= -->
  <section id="order" class="tab">
    <button onclick="addOrderRow()">＋ 新增</button>
    <table id="orderTable">
      <tr>
        <th>訂單編號</th><th>品名</th><th>數量</th><th>金額</th>
        <th>狀態</th><th>日期</th><th></th>
      </tr>
    </table>
  </section>
<script type="module" src="script.js"></script>
</body>
</html>
