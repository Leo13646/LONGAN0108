<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>財務報表系統</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js" defer></script>
</head>
<body>
  <div class="container">
    <h1>財務報表</h1>

    <div class="input-row">
      <select id="type">
        <option value="income">收入</option>
        <option value="expense">支出</option>
      </select>
      <input type="number" id="amount" placeholder="金額" />
      <input type="date" id="date" />
      <button id="addBtn">新增一筆</button>
    </div>

    <div id="netProfit" class="profit-display">淨利：0</div>

    <ul id="historyList" class="history"></ul>
  </div>
</body>
</html>
