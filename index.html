<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>共享資料儀表板</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 財務資料區塊 -->
  <div id="finance" class="section">
    <h2>財務資料</h2>
    <form id="finance-form">
      <label>類別：
        <input type="text" id="finance-category" required />
      </label>
      <label>金額：
        <input type="number" id="finance-amount" required />
      </label>
      <button type="submit" id="finance-add-btn">新增</button>
      <button type="button" id="finance-update-btn" style="display:none;">更新</button>
      <button type="button" id="finance-cancel-btn" style="display:none;">取消</button>
    </form>
    <!-- 財務圖表 -->
    <canvas id="financeChart" width="400" height="200"></canvas>
    <!-- 財務資料清單 -->
    <ul id="finance-list"></ul>
  </div>

  <!-- KOL 資料區塊 -->
  <div id="kol" class="section">
    <h2>KOL</h2>
    <form id="kol-form">
      <label>名稱：
        <input type="text" id="kol-name" required />
      </label>
      <button type="submit" id="kol-add-btn">新增</button>
      <button type="button" id="kol-update-btn" style="display:none;">更新</button>
      <button type="button" id="kol-cancel-btn" style="display:none;">取消</button>
    </form>
    <!-- KOL 清單 -->
    <ul id="kol-list"></ul>
  </div>

  <!-- 庫存資料區塊 -->
  <div id="inventory" class="section">
    <h2>庫存</h2>
    <form id="inventory-form">
      <label>品項：
        <input type="text" id="inventory-name" required />
      </label>
      <label>數量：
        <input type="number" id="inventory-quantity" required />
      </label>
      <button type="submit" id="inventory-add-btn">新增</button>
      <button type="button" id="inventory-update-btn" style="display:none;">更新</button>
      <button type="button" id="inventory-cancel-btn" style="display:none;">取消</button>
    </form>
    <!-- 庫存清單 -->
    <ul id="inventory-list"></ul>
  </div>

  <!-- 訂單資料區塊 -->
  <div id="orders" class="section">
    <h2>訂單</h2>
    <form id="orders-form">
      <label>名稱/編號：
        <input type="text" id="orders-name" required />
      </label>
      <label>數量：
        <input type="number" id="orders-quantity" required />
      </label>
      <button type="submit" id="orders-add-btn">新增</button>
      <button type="button" id="orders-update-btn" style="display:none;">更新</button>
      <button type="button" id="orders-cancel-btn" style="display:none;">取消</button>
    </form>
    <!-- 訂單清單 -->
    <ul id="orders-list"></ul>
  </div>

  <!-- 引入 Chart.js 圖表庫 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- 引入 Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <!-- 引入主要腳本 -->
  <script src="script.js"></script>
</body>
</html>
